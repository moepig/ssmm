services:
  floci:
    image: floci/floci:latest-compat@sha256:954ea3f472c85c569569ab81d8e79a28dd15a769c10ab8374c106537aa45fc1d
    ports:
      - "4566:4566"
    environment:
      FLOCI_SERVICES_EC2_MOCK: "true"
      FLOCI_SERVICES_SSM_ENABLED: "true"
      AWS_DEFAULT_REGION: "${FLOCI_REGION:-us-east-1}"
    volumes:
      - ./init/ready.d:/etc/floci/init/ready.d:ro
