version: 2

project_name: ssmm

before:
  hooks:
    - go test ./...

builds:
  - main: ./cmd/ssmm
    binary: ssmm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [ binary ]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  prerelease: auto
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: false
  mode: keep-existing
